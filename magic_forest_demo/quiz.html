<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сиқырлы орман — Сұрақтар</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene quiz-scene">
  <div class="card wide">
    <p class="eyebrow">2-БӨЛІМ · СИҚЫРЛЫ ЭКРАН</p>
    <div id="progress" class="progress">1 / 3 сұрақ</div>
    <h1 id="question">Әкенің әкесі кім?</h1>
    <div id="answers" class="answers"></div>
    <p id="feedback" class="feedback" aria-live="polite">Дұрыс жауапты таңда!</p>
    <div class="actions">
      <a class="back" href="map.html">← Картаға қайту</a>
      <button id="next" class="button" disabled>Келесі →</button>
    </div>
  </div>
</main>
<script>
const questions = [
  {q:"Әкенің әкесі кім?", a:["Ата","Аға","Нағашы"], correct:0},
  {q:"Ананың анасы кім?", a:["Әпке","Нағашы әже","Іні"], correct:1},
  {q:"Өзіңнен үлкен ұл бала кім?", a:["Іні","Ата","Аға"], correct:2}
];
let current = 0, answered = false, score = 0;
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const feedbackEl = document.getElementById("feedback");
const progressEl = document.getElementById("progress");
const nextBtn = document.getElementById("next");

function render() {
  answered = false;
  const item = questions[current];
  progressEl.textContent = `${current + 1} / ${questions.length} сұрақ`;
  questionEl.textContent = item.q;
  feedbackEl.textContent = "Дұрыс жауапты таңда!";
  feedbackEl.className = "feedback";
  answersEl.innerHTML = "";
  nextBtn.disabled = true;
  nextBtn.textContent = current === questions.length - 1 ? "Нәтиже →" : "Келесі →";
  item.a.forEach((answer, index) => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = answer;
    button.onclick = () => choose(index, button);
    answersEl.appendChild(button);
  });
}
function choose(index, button) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  [...answersEl.children].forEach((b, i) => {
    b.disabled = true;
    if (i === item.correct) b.classList.add("correct");
  });
  if (index === item.correct) {
    score++;
    feedbackEl.textContent = "Дұрыс! Қақпа жарқырап ашылды ✨";
    feedbackEl.className = "feedback good";
  } else {
    button.classList.add("wrong");
    feedbackEl.textContent = "Тағы бір рет ойлан! Жасыл түспен дұрыс жауап көрсетілді.";
    feedbackEl.className = "feedback bad";
  }
  nextBtn.disabled = false;
}
nextBtn.onclick = () => {
  if (current < questions.length - 1) {
    current++;
    render();
  } else {
    questionEl.textContent = `Жарайсың! Нәтиже: ${score} / ${questions.length}`;
    progressEl.textContent = "Сынақ аяқталды";
    answersEl.innerHTML = '<div class="finish">🏆 Достық еліне тағы бір қадам!</div>';
    feedbackEl.textContent = "Картаны ашып, басқа сынақтарды күте аласың.";
    feedbackEl.className = "feedback good";
    nextBtn.textContent = "Картаға оралу";
    nextBtn.onclick = () => location.href = "map.html";
  }
};
render();
</script>
</body>
</html>
